packages:
  always: !include always.yaml
  wifi: !include wifi.yaml


esp8266:
  board: esp01_1m


output:
  - platform: esp8266_pwm
    pin: 15
    frequency: 1000 Hz
    id: pwm_red
  - platform: esp8266_pwm
    pin: 13
    frequency: 1000 Hz
    id: pwm_green
  - platform: esp8266_pwm
    pin: 12
    frequency: 1000 Hz
    id: pwm_blue
