substitutions:
  device_name: lichtsterkte
  friendly_name: Lichtsterkte
  ota_password: !secret lichtsterkte_ota_password
  api_encryption_key: !secret lichtsterkte_api_encryption_key


packages:
  wifi: !include common/wifi.yaml
  always: !include common/always.yaml


esphome:


esp8266:
  board: d1_mini

i2c:
  scan: False
  frequency: 400kHz

sensor:
  - platform: bh1750
    name: "BH1750 Illuminance"
    address: 0x23
    update_interval: 60s