substitutions:
  device_name: esp32-bluetooth-proxy
  friendly_name: Bluetooth Proxy
  api_encryption_key: !secret esp32_bluetooth_proxy_api_encryption_key


packages:
  wifi: !include common/wifi.yaml
  always: !include common/always.yaml


esphome:
  min_version: 2025.2.1


esp32:
  board: esp32dev
  framework:
    type: esp-idf


esp32_ble_tracker:
  scan_parameters:
    # We currently use the defaults to ensure Bluetooth
    # can co-exist with WiFi In the future we may be able to
    # enable the built-in coexistence logic in ESP-IDF
    active: true

bluetooth_proxy:
  active: true

button:
  - platform: safe_mode
    id: button_safe_mode
    name: Safe Mode Boot

  - platform: factory_reset
    id: factory_reset_btn
    name: Factory reset